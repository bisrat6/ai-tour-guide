            type: string
            description: Opaque cursor from a previous page.
          required: false
          description: Opaque cursor from a previous page.
          name: cursor
          in: query
        - schema:
            type: string
            format: uuid
            description: SYSTEM_ADMIN only. A MUSEUM_ADMIN is always scoped to its own
              museum.
          required: false
          description: SYSTEM_ADMIN only. A MUSEUM_ADMIN is always scoped to its own museum.
          name: museumId
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 50
          required: false
          name: entityType
          in: query
        - schema:
            $ref: "#/components/schemas/AuditAction"
          required: false
          name: action
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: actorId
          in: query
        - schema:
            type: string
            format: date-time
            description: Inclusive lower bound on createdAt.
          required: false
          description: Inclusive lower bound on createdAt.
