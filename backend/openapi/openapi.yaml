openapi: 3.1.0
info:
  version: 0.1.0
  title: Adwa AI Tour Guide — Admin API
  description: Developer 1’s admin surface (auth, museums, rooms, items).
    Generated from Zod schemas — do not hand-edit. Every JSON request body is
    capped at 100kb globally; routes that accept a body therefore declare 413.
    See docs/backend-implementation-plan.md and developer1-detailed-plan.md.
servers:
  - url: /
    description: Relative to wherever the API is deployed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT from POST /admin/login. See §8.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        dbLatencyMs:
          type: integer
          minimum: 0
          description: Round-trip time of a real SELECT 1 against Postgres.
          example: 3
        version:
          type: string
          description: Value of version in package.json.
          example: 0.1.0
      required:
        - status
        - dbLatencyMs
        - version
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: Invalid credentials.
            code:
              $ref: "#/components/schemas/ErrorCode"
            requestId:
              type: string
              example: 01HQZXK7N8VJYB3F9G6R2T4W5M
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                required:
                  - path
                  - message
              description: Present only for VALIDATION_ERROR, one entry per invalid field.
          required:
            - message
            - code
            - requestId
      required:
        - error
      description: Shape of every non-2xx response, from every route. See §7.1.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CROSS_TENANT_ACCESS
        - NOT_FOUND
        - CONFLICT
        - ROOM_REFERENCED
        - INVALID_ROOM_SEQUENCE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - UPSTREAM_FAILURE
        - UPSTREAM_UNAVAILABLE
        - TIER_LIMIT_EXCEEDED
        - SUBSCRIPTION_INACTIVE
        - PAYMENT_ALREADY_PENDING
        - PAYMENT_NOT_FOUND
        - TICKET_URL_INVALID
      description: Machine-readable error code. See §7.2 of the backend implementation plan.
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT, 12-hour expiry.
        role:
          $ref: "#/components/schemas/AdminRole"
        museumId:
          type:
            - string
            - "null"
          description: null for SYSTEM_ADMIN.
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - role
        - museumId
        - expiresAt
    AdminRole:
      type: string
      enum:
        - SYSTEM_ADMIN
        - MUSEUM_ADMIN
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@adwamuseum.org
        password:
          type: string
          minLength: 1
          example: correct-horse-battery-staple
      required:
        - email
        - password
    ListMuseumsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Museum"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    Museum:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Adwa Victory Memorial Museum
        slug:
          type: string
          example: adwa
        status:
          $ref: "#/components/schemas/MuseumStatus"
        ticketValidationUrl:
          type:
            - string
            - "null"
          format: uri
        systemPrompt:
          type:
            - string
            - "null"
        defaultVoiceId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - ticketValidationUrl
        - systemPrompt
        - defaultVoiceId
        - createdAt
        - updatedAt
    MuseumStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
    CreateMuseumResponse:
      type: object
      properties:
        museum:
          $ref: "#/components/schemas/Museum"
        admin:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              type: string
              enum:
                - MUSEUM_ADMIN
            museumId:
              type: string
              format: uuid
          required:
            - id
            - email
            - role
            - museumId
      required:
        - museum
        - admin
    CreateMuseumRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]+$
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 8
      required:
        - name
        - slug
        - adminEmail
        - adminPassword
    UpdateMuseumRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/MuseumStatus"
        ticketValidationUrl:
          type:
            - string
            - "null"
          format: uri
        systemPrompt:
          type:
            - string
            - "null"
        defaultVoiceId:
          type:
            - string
            - "null"
    ListMuseumAdminsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - SYSTEM_ADMIN
            - MUSEUM_ADMIN
        museumId:
          type:
            - string
            - "null"
          format: uuid
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - museumId
        - lastLoginAt
        - createdAt
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - SYSTEM_ADMIN
            - MUSEUM_ADMIN
        museumId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - id
        - email
        - role
        - museumId
    AddMuseumAdminRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    ListRoomsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type:
            - string
            - "null"
          description: Original id from data/*.json, see §16.1.
        museumId:
          type: string
          format: uuid
        storyOrder:
          type: integer
          minimum: 1
        title:
          type: string
        roomOverviewText:
          type: string
          description: Grounding prose for chat.
        narrationScript:
          type: string
          description: Spoken script sent to TTS.
        roomAudioUrl:
          type:
            - string
            - "null"
          format: uri
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - legacyId
        - museumId
        - storyOrder
        - title
        - roomOverviewText
        - narrationScript
        - roomAudioUrl
        - nextRoomId
        - createdAt
        - updatedAt
    RoomWithItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type:
            - string
            - "null"
          description: Original id from data/*.json, see §16.1.
        museumId:
          type: string
          format: uuid
        storyOrder:
          type: integer
          minimum: 1
        title:
          type: string
        roomOverviewText:
          type: string
          description: Grounding prose for chat.
        narrationScript:
          type: string
          description: Spoken script sent to TTS.
        roomAudioUrl:
          type:
            - string
            - "null"
          format: uri
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
      required:
        - id
        - legacyId
        - museumId
        - storyOrder
        - title
        - roomOverviewText
        - narrationScript
        - roomAudioUrl
        - nextRoomId
        - createdAt
        - updatedAt
        - items
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type:
            - string
            - "null"
        roomId:
          type: string
          format: uuid
        name:
          type: string
        shortDescription:
          type: string
        detailText:
          type: string
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        displayOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - legacyId
        - roomId
        - name
        - shortDescription
        - detailText
        - imageUrl
        - displayOrder
        - createdAt
        - updatedAt
    CreateRoomRequest:
      type: object
      properties:
        museumId:
          type: string
          format: uuid
          description: Required for SYSTEM_ADMIN, taken from the token for MUSEUM_ADMIN.
        title:
          type: string
          minLength: 1
        roomOverviewText:
          type: string
          minLength: 1
        narrationScript:
          type: string
          minLength: 1
        storyOrder:
          type: integer
          minimum: 1
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - title
        - roomOverviewText
        - narrationScript
        - storyOrder
    UpdateRoomRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        roomOverviewText:
          type: string
          minLength: 1
        narrationScript:
          type: string
          minLength: 1
        storyOrder:
          type: integer
          minimum: 1
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
    ReorderItemsRequest:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
        - itemIds
    ListItemsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    CreateItemRequest:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        shortDescription:
          type: string
          minLength: 1
        detailText:
          type: string
          minLength: 1
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        displayOrder:
          type: integer
          minimum: 0
      required:
        - roomId
        - name
        - shortDescription
        - detailText
    UpdateItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        shortDescription:
          type: string
          minLength: 1
        detailText:
          type: string
          minLength: 1
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        displayOrder:
          type: integer
          minimum: 0
    ListAuditLogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          example: UPDATE
        entityType:
          type: string
          example: Room
        entityId:
          type: string
        museumId:
          type:
            - string
            - "null"
          format: uuid
        museumName:
          type:
            - string
            - "null"
        adminUserId:
          type:
            - string
            - "null"
          format: uuid
        adminEmail:
          type:
            - string
            - "null"
          format: email
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - entityType
        - entityId
        - museumId
        - museumName
        - adminUserId
        - adminEmail
        - createdAt
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness and database reachability
      description: Unauthenticated. Performs a real SELECT 1, so a deployment with a
        broken connection string fails its health check instead of serving 500s
        on every other route.
      responses:
        "200":
          description: Service is up and the database answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A dependency is unreachable (UPSTREAM_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/login:
    post:
      tags:
        - Auth
      summary: Admin login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body exceeds the 100kb cap (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited (RATE_LIMITED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/museums:
    get:
      tags:
        - Museums
      summary: List museums (SYSTEM_ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            description: Page size. Defaults to 50, capped at 200.
          required: false
          description: Page size. Defaults to 50, capped at 200.
          name: limit
          in: query
        - schema:
            type: string
            description: Opaque cursor from a previous page.
          required: false
          description: Opaque cursor from a previous page.
          name: cursor
          in: query
      responses:
        "200":
          description: Paginated list of museums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMuseumsResponse"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wrong role or wrong museum scope (FORBIDDEN / CROSS_TENANT_ACCESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Museums
      summary: Create a museum and its first MUSEUM_ADMIN (SYSTEM_ADMIN only)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMuseumRequest"
      responses:
        "201":
          description: Museum and admin created in one transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMuseumResponse"
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wrong role or wrong museum scope (FORBIDDEN / CROSS_TENANT_ACCESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Unique constraint conflict, or a room delete blocked by a reference
            (CONFLICT / ROOM_REFERENCED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body exceeds the 100kb cap (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/museums/{id}:
    get:
      tags:
        - Museums
      summary: Get a museum by id
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The museum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Museum"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wrong role or wrong museum scope (FORBIDDEN / CROSS_TENANT_ACCESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags:
        - Museums
      summary: Update a museum. status is SYSTEM_ADMIN-only; the rest are writable by
        the museum’s own admin.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMuseumRequest"
      responses:
        "200":
          description: Updated museum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Museum"
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wrong role or wrong museum scope (FORBIDDEN / CROSS_TENANT_ACCESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body exceeds the 100kb cap (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/museums/{id}/admins:
    get:
      tags:
        - Museums
      summary: List the museum’s administrators
      description: "Scoped rather than SYSTEM_ADMIN-only, unlike the POST on the same
        path: a museum admin may read its own museum’s administrators.
        passwordHash is never returned, and there is no name or status column on
        an account."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            description: Page size. Defaults to 50, capped at 200.
          required: false
          description: Page size. Defaults to 50, capped at 200.
          name: limit
          in: query
        - schema:
            type: string
            description: Opaque cursor from a previous page.
          required: false
          description: Opaque cursor from a previous page.
          name: cursor
          in: query
      responses:
        "200":
          description: Paginated list of the museum’s administrators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMuseumAdminsResponse"
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wrong role or wrong museum scope (FORBIDDEN / CROSS_TENANT_ACCESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Museums
      summary: Add a further admin to an existing museum (SYSTEM_ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMuseumAdminRequest"
      responses:
        "201":
          description: Admin created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Wrong role or wrong museum scope (FORBIDDEN / CROSS_TENANT_ACCESS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Unique constraint conflict, or a room delete blocked by a reference
            (CONFLICT / ROOM_REFERENCED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body exceeds the 100kb cap (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/rooms:
    get:
      tags:
        - Rooms
      summary: List rooms, scoped to the caller’s museum unless SYSTEM_ADMIN
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            description: Page size. Defaults to 50, capped at 200.
          required: false
