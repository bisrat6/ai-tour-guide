openapi: 3.1.0
info:
  version: 0.1.0
  title: Adwa AI Tour Guide — Admin API
  description: "The full admin surface: auth, museums, admin users, rooms, items,
    audit, overview, billing, and the visitor ticket check. Generated from Zod
    schemas — do not hand-edit. Every JSON request body is capped at 100kb
    globally; routes that accept a body therefore declare 413. See
    docs/backend-implementation-plan.md and developer1-detailed-plan.md."
servers:
  - url: /
    description: Relative to wherever the API is deployed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT from POST /admin/login. See §8.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        dbLatencyMs:
          type: integer
          minimum: 0
          description: Round-trip time of a real SELECT 1 against Postgres.
          example: 3
        version:
          type: string
          description: Value of version in package.json.
          example: 0.1.0
      required:
        - status
        - dbLatencyMs
        - version
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: Invalid credentials.
            code:
              $ref: "#/components/schemas/ErrorCode"
            requestId:
              type: string
              example: 01HQZXK7N8VJYB3F9G6R2T4W5M
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                required:
                  - path
                  - message
              description: Present only for VALIDATION_ERROR, one entry per invalid field.
          required:
            - message
            - code
            - requestId
      required:
        - error
      description: Shape of every non-2xx response, from every route. See §7.1.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CROSS_TENANT_ACCESS
        - NOT_FOUND
        - CONFLICT
        - ROOM_REFERENCED
        - INVALID_ROOM_SEQUENCE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - UPSTREAM_FAILURE
        - UPSTREAM_UNAVAILABLE
        - TIER_LIMIT_EXCEEDED
        - SUBSCRIPTION_INACTIVE
        - PAYMENT_ALREADY_PENDING
        - PAYMENT_NOT_FOUND
        - TICKET_URL_INVALID
      description: Machine-readable error code. See §7.2 of the backend implementation plan.
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT, 12-hour expiry.
        role:
          $ref: "#/components/schemas/AdminRole"
        museumId:
          type:
            - string
            - "null"
          description: null for SYSTEM_ADMIN.
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - role
        - museumId
        - expiresAt
    AdminRole:
      type: string
      enum:
        - SYSTEM_ADMIN
        - MUSEUM_ADMIN
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@adwamuseum.org
        password:
          type: string
          minLength: 1
          example: correct-horse-battery-staple
      required:
        - email
        - password
    ListMuseumsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Museum"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    Museum:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Adwa Victory Memorial Museum
        slug:
          type: string
          example: adwa
        status:
          $ref: "#/components/schemas/MuseumStatus"
        cityCountry:
          type:
            - string
            - "null"
          example: Adwa, Ethiopia
        ticketValidationUrl:
          type:
            - string
            - "null"
          format: uri
        gateMode:
          $ref: "#/components/schemas/GateMode"
        allowedTicketPrefix:
          type:
            - string
            - "null"
        graceWindowMinutes:
          type: integer
          minimum: 0
        systemPrompt:
          type:
            - string
            - "null"
          description: Grounding policy for chat.
        personaName:
          type:
            - string
            - "null"
        guideStyleTone:
          $ref: "#/components/schemas/GuideStyleTone"
        defaultVoiceId:
          type:
            - string
            - "null"
        speakingRate:
          type: number
          description: Multiplier on the provider default. 1 = normal.
        pronunciationHints:
          type:
            - string
            - "null"
        tier:
          type: string
          enum:
            - BASIC
            - PRO
            - ENTERPRISE
        subscriptionStatus:
          type: string
          enum:
            - ACTIVE
            - PAST_DUE
            - CANCELED
        subscriptionRenewsAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - cityCountry
        - ticketValidationUrl
        - gateMode
        - allowedTicketPrefix
        - graceWindowMinutes
        - systemPrompt
        - personaName
        - guideStyleTone
        - defaultVoiceId
        - speakingRate
        - pronunciationHints
        - tier
        - subscriptionStatus
        - subscriptionRenewsAt
        - createdAt
        - updatedAt
    MuseumStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
    GateMode:
      type: string
      enum:
        - TICKET_CODE
        - STAFF_ASSISTED
    GuideStyleTone:
      type: string
      enum:
        - FORMAL
        - CONVERSATIONAL
        - SCHOLARLY
    CreateMuseumResponse:
      type: object
      properties:
        museum:
          $ref: "#/components/schemas/Museum"
        admin:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              type: string
              enum:
                - MUSEUM_ADMIN
            museumId:
              type: string
              format: uuid
          required:
            - id
            - email
            - role
            - museumId
      required:
        - museum
        - admin
    CreateMuseumRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]+$
        cityCountry:
          type: string
          minLength: 1
          maxLength: 200
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 8
      required:
        - name
        - slug
        - adminEmail
        - adminPassword
    UpdateMuseumRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: ^[a-z0-9-]+$
        status:
          $ref: "#/components/schemas/MuseumStatus"
        cityCountry:
          type:
            - string
            - "null"
          maxLength: 200
        ticketValidationUrl:
          type:
            - string
            - "null"
          format: uri
        gateMode:
          $ref: "#/components/schemas/GateMode"
        allowedTicketPrefix:
          type:
            - string
            - "null"
          maxLength: 64
        graceWindowMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        systemPrompt:
          type:
            - string
            - "null"
        personaName:
          type:
            - string
            - "null"
          maxLength: 200
        guideStyleTone:
          $ref: "#/components/schemas/GuideStyleTone"
        defaultVoiceId:
          type:
            - string
            - "null"
        speakingRate:
          type: number
          minimum: 0.5
          maximum: 2
        pronunciationHints:
          type:
            - string
            - "null"
      additionalProperties: false
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - SYSTEM_ADMIN
            - MUSEUM_ADMIN
        status:
          type: string
          enum:
            - ACTIVE
            - INVITED
            - SUSPENDED
        museumId:
          type:
            - string
            - "null"
          format: uuid
        museumName:
          type:
            - string
            - "null"
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - displayName
        - role
        - status
        - museumId
        - museumName
        - lastLoginAt
        - createdAt
    AddMuseumAdminRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - email
        - password
    ListRoomsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type:
            - string
            - "null"
          description: Original id from data/*.json, see §16.1.
        museumId:
          type: string
          format: uuid
        storyOrder:
          type: integer
          minimum: 1
        title:
          type: string
        roomOverviewText:
          type: string
          description: Grounding prose for chat.
        narrationScript:
          type: string
          description: Spoken script sent to TTS.
        roomAudioUrl:
          type:
            - string
            - "null"
          format: uri
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - legacyId
        - museumId
        - storyOrder
        - title
        - roomOverviewText
        - narrationScript
        - roomAudioUrl
        - nextRoomId
        - createdAt
        - updatedAt
    RoomWithItems:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type:
            - string
            - "null"
          description: Original id from data/*.json, see §16.1.
        museumId:
          type: string
          format: uuid
        storyOrder:
          type: integer
          minimum: 1
        title:
          type: string
        roomOverviewText:
          type: string
          description: Grounding prose for chat.
        narrationScript:
          type: string
          description: Spoken script sent to TTS.
        roomAudioUrl:
          type:
            - string
            - "null"
          format: uri
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
      required:
        - id
        - legacyId
        - museumId
        - storyOrder
        - title
        - roomOverviewText
        - narrationScript
        - roomAudioUrl
        - nextRoomId
        - createdAt
        - updatedAt
        - items
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type:
            - string
            - "null"
        roomId:
          type: string
          format: uuid
        name:
          type: string
        shortDescription:
          type: string
        detailText:
          type: string
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        displayOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - legacyId
        - roomId
        - name
        - shortDescription
        - detailText
        - imageUrl
        - displayOrder
        - createdAt
        - updatedAt
    CreateRoomRequest:
      type: object
      properties:
        museumId:
          type: string
          format: uuid
          description: Required for SYSTEM_ADMIN, taken from the token for MUSEUM_ADMIN.
        title:
          type: string
          minLength: 1
        roomOverviewText:
          type: string
          minLength: 1
        narrationScript:
          type: string
          minLength: 1
        storyOrder:
          type: integer
          minimum: 1
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - title
        - roomOverviewText
        - narrationScript
        - storyOrder
    UpdateRoomRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        roomOverviewText:
          type: string
          minLength: 1
        narrationScript:
          type: string
          minLength: 1
        storyOrder:
          type: integer
          minimum: 1
        nextRoomId:
          type:
            - string
            - "null"
          format: uuid
    ReorderItemsRequest:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required:
        - itemIds
    ListItemsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    CreateItemRequest:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        shortDescription:
          type: string
          minLength: 1
        detailText:
          type: string
          minLength: 1
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        displayOrder:
          type: integer
          minimum: 0
      required:
        - roomId
        - name
        - shortDescription
        - detailText
    UpdateItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        shortDescription:
          type: string
          minLength: 1
        detailText:
          type: string
          minLength: 1
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        displayOrder:
          type: integer
          minimum: 0
    ListAdminsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    AdminStatus:
      type: string
      enum:
        - ACTIVE
        - INVITED
        - SUSPENDED
    CreateAdminRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - SYSTEM_ADMIN
            - MUSEUM_ADMIN
        museumId:
          type: string
          format: uuid
          description: Required when role is MUSEUM_ADMIN.
      required:
        - email
        - password
        - role
    UpdateAdminRequest:
      type: object
      properties:
        displayName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        status:
          $ref: "#/components/schemas/AdminStatus"
        password:
          type: string
          minLength: 8
      additionalProperties: false
    ListAuditLogsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - data
        - nextCursor
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/AuditAction"
        entityType:
          type: string
        entityId:
          type: string
        entityLabel:
          type: string
        museumId:
          type:
            - string
            - "null"
          format: uuid
        museumName:
          type:
            - string
            - "null"
        actorId:
          type:
            - string
            - "null"
          format: uuid
        actorEmail:
          type:
            - string
            - "null"
        actorDisplayName:
          type:
            - string
            - "null"
        actorRole:
          type:
            - string
            - "null"
          enum:
            - SYSTEM_ADMIN
            - MUSEUM_ADMIN
            - null
        before: {}
        after: {}
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - entityType
        - entityId
        - entityLabel
        - museumId
        - museumName
        - actorId
        - actorEmail
        - actorDisplayName
        - actorRole
        - createdAt
    AuditAction:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
    TenantOverview:
      type: object
      properties:
        museumId:
          type: string
          format: uuid
        museumName:
          type: string
        stats:
          $ref: "#/components/schemas/MuseumStats"
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomReadiness"
        tier:
          type: string
          enum:
            - BASIC
            - PRO
            - ENTERPRISE
        subscriptionStatus:
          type: string
          enum:
            - ACTIVE
            - PAST_DUE
            - CANCELED
        limits:
          type: object
          properties:
            maxRooms:
              type:
                - integer
                - "null"
            maxItemsPerRoom:
              type:
                - integer
                - "null"
            maxAdminUsers:
              type:
                - integer
                - "null"
          required:
            - maxRooms
            - maxItemsPerRoom
            - maxAdminUsers
      required:
        - museumId
        - museumName
        - stats
        - rooms
        - tier
        - subscriptionStatus
        - limits
    MuseumStats:
      type: object
      properties:
        roomCount:
          type: integer
          minimum: 0
        itemCount:
          type: integer
          minimum: 0
        adminCount:
          type: integer
          minimum: 0
        roomsMissingNarration:
          type: integer
          minimum: 0
        roomsWithoutItems:
          type: integer
          minimum: 0
        roomsReady:
          type: integer
          minimum: 0
        roomsInSequence:
          type: integer
          minimum: 0
        lastEditedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - roomCount
        - itemCount
        - adminCount
        - roomsMissingNarration
        - roomsWithoutItems
        - roomsReady
        - roomsInSequence
        - lastEditedAt
    RoomReadiness:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storyOrder:
          type: integer
        title:
          type: string
        readiness:
          type: string
          enum:
            - ready
            - incomplete
            - empty
        itemCount:
          type: integer
          minimum: 0
        narrationChars:
          type: integer
          minimum: 0
        hasAudio:
          type: boolean
        inSequence:
          type: boolean
          description: Reachable by following nextRoomId from the first room.
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - storyOrder
        - title
        - readiness
        - itemCount
        - narrationChars
        - hasAudio
        - inSequence
        - updatedAt
    SystemHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        version:
          type: string
        environment:
          type: string
        dbLatencyMs:
          type: integer
          minimum: 0
        uptimeSeconds:
          type: integer
          minimum: 0
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/AdapterHealth"
        checkedAt:
          type: string
          format: date-time
      required:
        - status
        - version
        - environment
        - dbLatencyMs
        - uptimeSeconds
        - adapters
        - checkedAt
    AdapterHealth:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
        mode:
          type: string
          enum:
            - live
            - fake
            - unconfigured
        state:
          type: string
          enum:
            - healthy
            - degraded
            - retrying
            - breaker_open
            - unknown
        consecutiveFailures:
          type: integer
          minimum: 0
        breakerOpenedAt:
          type:
            - string
            - "null"
          format: date-time
        timeoutMs:
          type:
            - integer
            - "null"
        note:
          type: string
      required:
        - id
        - label
        - provider
        - mode
        - state
        - consecutiveFailures
        - breakerOpenedAt
        - timeoutMs
        - note
    SpendResponse:
      type: object
      properties:
        window:
          type: string
          enum:
            - 7d
            - 30d
            - 90d
        since:
          type: string
          format: date-time
        currency:
          type: string
          enum:
            - ETB
        totalEtb:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpendRow"
      required:
        - window
        - since
        - currency
        - totalEtb
        - rows
    SpendRow:
      type: object
      properties:
        museumId:
          type: string
          format: uuid
        museumName:
          type: string
        slug:
          type: string
        cityCountry:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
        tier:
          type: string
          enum:
            - BASIC
            - PRO
            - ENTERPRISE
        subscriptionStatus:
          type: string
          enum:
            - ACTIVE
            - PAST_DUE
            - CANCELED
        paidAmountEtb:
          type: string
          description: Fixed to 2 decimal places.
        paymentCount:
          type: integer
          minimum: 0
        lastPaidAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - museumId
        - museumName
        - slug
        - cityCountry
        - status
        - tier
        - subscriptionStatus
        - paidAmountEtb
        - paymentCount
        - lastPaidAt
  parameters: {}
paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness and database reachability
      description: Unauthenticated. Performs a real SELECT 1, so a deployment with a
        broken connection string fails its health check instead of serving 500s
        on every other route.
      responses:
        "200":
          description: Service is up and the database answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A dependency is unreachable (UPSTREAM_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/login:
    post:
      tags:
        - Auth
      summary: Admin login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing, invalid, or expired token (UNAUTHENTICATED /
            INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body exceeds the 100kb cap (VALIDATION_ERROR).
          content:
