  /tickets/validate:
    post:
      tags:
        - Tickets
      summary: Check a visitor ticket against the museum’s vendor
      description: "Unauthenticated and rate limited twice: per caller IP, and per
        museum so one tenant cannot exhaust the vendor allowance.
        ticketRequired=false means the museum has no gate configured, so valid
        is vacuously true."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                museumId:
                  type: string
                  format: uuid
                ticketCode:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - museumId
                - ticketCode
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  ticketRequired:
                    type: boolean
                required:
                  - valid
                  - ticketRequired
        "400":
          description: Malformed or missing request fields (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Request body exceeds the 100kb cap (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: nextRoomId crosses museums or forms a cycle (INVALID_ROOM_SEQUENCE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited (RATE_LIMITED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: A dependency is unreachable (UPSTREAM_UNAVAILABLE).
          content:
