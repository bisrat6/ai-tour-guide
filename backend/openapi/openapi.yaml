  /admin/audit-logs:
    get:
      tags:
        - Audit
      summary: Read the admin audit trail
      description: Newest first. A MUSEUM_ADMIN sees only its own museum’s rows;
        control-plane events, which carry no museumId, stay invisible to it.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            description: Page size. Defaults to 50, capped at 200.
          required: false
          description: Page size. Defaults to 50, capped at 200.
          name: limit
          in: query
