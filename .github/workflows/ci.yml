name: backend CI

on:
  push:
    branches: ['**']
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tourguide
          POSTGRES_PASSWORD: tourguide_dev_password
          POSTGRES_DB: ai_tour_guide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourguide -d ai_tour_guide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tourguide:tourguide_dev_password@localhost:5432/ai_tour_guide_test
      TEST_DATABASE_URL: postgresql://tourguide:tourguide_dev_password@localhost:5432/ai_tour_guide_test
      JWT_SECRET: ci-only-secret-do-not-use-in-prod-32chars
      JWT_EXPIRES_IN: 12h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Generate OpenAPI doc (fails the build if it doesn't run cleanly)
        run: npm run generate:openapi

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Test
        run: npm run test
